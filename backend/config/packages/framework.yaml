framework:
    secret: '%env(APP_SECRET)%'

    session: true

    exceptions:
        App\Exception\ApiException:
            log_level: info
        Symfony\Component\Serializer\Exception\ExtraAttributesException:
            log_level: info

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
