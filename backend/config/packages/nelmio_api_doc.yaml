nelmio_api_doc:
    documentation:
        info:
            title: PadelHub API
            description: API do prowadzenia turniejów padlowych w formatach Americano i Mexicano
            version: 1.0.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - Bearer: []
    areas:
        path_patterns:
            - ^/api(?!/doc)
