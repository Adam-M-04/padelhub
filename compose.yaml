services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PHP_CLI_SERVER_WORKERS: 4
      APP_SECRET: ${APP_SECRET}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      FIXTURES_ADMIN_PASSWORD: ${FIXTURES_ADMIN_PASSWORD}
      FIXTURES_PLAYER_PASSWORD: ${FIXTURES_PLAYER_PASSWORD}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}?serverVersion=11.4.0-MariaDB&charset=utf8mb4
      MAILER_DSN: smtp://mailpit:1025
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/tournaments"]
      interval: 5s
      start_period: 120s
      retries: 10

  worker:
    build: ./backend
    entrypoint: ["docker-php-entrypoint"]
    command: php bin/console messenger:consume async -vv
    environment:
      APP_SECRET: ${APP_SECRET}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}?serverVersion=11.4.0-MariaDB&charset=utf8mb4
      MAILER_DSN: smtp://mailpit:1025
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
